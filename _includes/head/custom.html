{% include base_path %}

<!-- start custom head snippets -->

<!-- Browser favicons: serif MK monogram -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="{{ base_path }}/images/favicon.svg">

<!-- Apple and mobile icons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#243447">

<!-- Google Search Console verification -->
<meta name="google-site-verification" content="A8dqYYfwKwZoI6gmdzF1BXDR8cyMaY4YtEGN8fKrw3A" />

<!-- Academic icons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- MathJax configuration -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: {
      equationNumbers: { autoNumber: "all" }
    },
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML" async></script>

<!-- end custom head snippets -->
